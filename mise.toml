[tools]
node = "24"
uv = "0.11.19"
gitleaks = "8.30.1"

[tasks.install]
description = "Install the npm dependencies from the lockfile"
run = "npm ci"

[tasks.check]
description = "Run the same checks as CI (catalog validation, WoT, Thing Model static checks)"
run = "npm run check"

[tasks.gitleaks]
description = "Scan the full Git history (all refs) for secrets (matches are redacted in the output)"
run = "gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts=--all ."

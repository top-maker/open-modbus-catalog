# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: ADAM-4017+
aliases:
- ADAM4017+
category: analog-input-module
description: RS-485 Modbus RTU analog input module with eight differential channels for mV, V and mA signals.
translations:
  zh-CN:
    description: 这款 RS-485 模拟量输入模块支持 Modbus RTU 和 ADAM ASCII 命令，提供 8 路差分输入，可按通道设置 mV、V 和 mA 量程，隔离电压 3000 VDC。
specs:
- label: Analog inputs
  value: 8 differential, independently configured
- label: Input ranges
  value: 0–150 mV to ±10 V, ±20 mA, 0–20 mA, 4–20 mA
- label: Resolution
  value: 16 bit
- label: Sampling rate
  value: 10 samples/s total
- label: Isolation
  value: 3,000 VDC
- label: Power input
  value: 10–30 VDC, 1.2 W at 24 VDC
communication:
  protocols:
  - modbus-rtu
  defaults:
    serial:
      unitId: 1
      baudRate: 9600
      dataBits: 8
      parity: none
      stopBits: 1
    reference: 'ADAM-4000 Series User Manual, Edition 9: §2.2, printed page 10, address 01h and 9600 baud, factory protocol ADAM ASCII until set to Modbus as in Appendix H; §3.1, printed page 21, N, 8, 1'
documents:
- type: datasheet
  title: ADAM-4017+ / ADAM-4018+ / ADAM-4019+ datasheet
  url: 'https://advdownload.advantech.com/productfile/PIS/ADAM-4017%2B/file/ADAM-4017_4018_4019_DS%28092223%2920230928142137.pdf'
  reference: 2023-09-22 edition, page 1, ADAM-4017+ column
- type: manual
  title: ADAM-4000 Series User Manual, Edition 9
  url: 'https://advdownload.advantech.com/productfile/Downloadfile1/1-2IIGU49/ADAM-4000_Series_User_manual_Ed.9_FINAL.pdf'
  reference: §3.3.5, printed page 29; Appendix C.1 Figure C.1; Appendix G.1, printed page 265

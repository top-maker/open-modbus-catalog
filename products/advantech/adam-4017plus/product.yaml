# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: ADAM-4017+
category: analog-input-module
description: 8-channel differential analog input module for mV, V and mA signals, 16-bit, RS-485 Modbus RTU.
translations:
  zh-CN:
    description: 8 通道差分模拟量输入模块，各通道可独立设置量程，输入毫伏、伏和毫安信号，分辨率 16 位，隔离电压 3000 V DC，RS-485 接口，支持 Modbus RTU，默认 ASCII 协议。
specs:
- label: Channels
  value: 8 differential, individually configurable ranges
- label: Input ranges
  value: ±150 mV to ±10 V, 0–150 mV to 0–10 V, ±20 mA, 0–20 mA, 4–20 mA
- label: Resolution
  value: 16-bit; accuracy ±0.1% (voltage), ±0.2% (current)
- label: Isolation
  value: 3000 VDC
- label: Communication
  value: RS-485, ADAM ASCII or Modbus/RTU; ships with ADAM ASCII
- label: Dimensions
  value: 112 × 60 × 30 mm overall (H × W × D)
communication:
  protocols:
  - modbus-rtu
  defaults:
    serial:
      unitId: 1
      baudRate: 9600
      dataBits: 8
      parity: none
      stopBits: 1
    reference: 'ADAM-4000 Series User Manual Ed. 9, Appendix D.2, PDF page 260: new ADAM-4000 modules have address 1 and 9600, N, 8, 1. The module ships with the ADAM ASCII protocol; switch it to Modbus first by the INIT procedure of Appendix H.1, PDF page 290 (initial communication settings 9600 baud, N-8-1)'

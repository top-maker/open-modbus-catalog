# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: ADAM-4024
aliases:
- ADAM4024
category: analog-output-module
description: RS-485 Modbus RTU analog output module with four V or mA outputs and four dry or wet contact inputs.
translations:
  zh-CN:
    description: 这款 RS-485 模拟量输出模块支持 Modbus RTU 和 ADAM ASCII 命令，提供 4 路可选电压或电流的模拟量输出和 4 路干接点或湿接点数字量输入，隔离电压 3000 VDC。
specs:
- label: Analog outputs
  value: 4, current or voltage per channel
- label: Output ranges
  value: 0–20 mA, 4–20 mA, ±10 V, 0–10 V, ±5 V, 0–5 V
- label: Resolution
  value: 12 bit and 16 bit
- label: Digital inputs
  value: 4, dry or wet contact per channel
- label: Isolation
  value: 3,000 VDC
- label: Power input
  value: 10–30 VDC, 3 W at 24 VDC
communication:
  protocols:
  - modbus-rtu
  defaults:
    serial:
      unitId: 1
      baudRate: 9600
      dataBits: 8
      parity: none
      stopBits: 1
    reference: 'ADAM-4000 Series User Manual, Edition 9: §2.2, printed page 10, address 01h and 9600 baud, factory protocol ADAM ASCII until set to Modbus as in Appendix H; §3.1, printed page 21, N, 8, 1'
documents:
- type: datasheet
  title: ADAM-4021 / ADAM-4024 datasheet
  url: 'https://advdownload.advantech.com/productfile/PIS/ADAM-4024/file/ADAM-4021_4024-C_DS20260709165728.pdf'
  reference: 2024-11-27 edition, page 1, ADAM-4024 column
- type: manual
  title: ADAM-4000 Series User Manual, Edition 9
  url: 'https://advdownload.advantech.com/productfile/Downloadfile1/1-2IIGU49/ADAM-4000_Series_User_manual_Ed.9_FINAL.pdf'
  reference: §3.6, printed pages 41–43; Appendix G.1 item 6, printed page 267

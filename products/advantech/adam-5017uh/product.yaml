modelNumber: ADAM-5017UH
category: analog-input-module
description: 8-channel differential analog input module for ADAM-5000 bases, 12-bit, ±10 V, 0–10 V and 0/4–20 mA
translations:
  zh-CN:
    description: 用于 ADAM-5000 系列底座的 8 通道差分模拟量输入模块，分辨率 12 位，每个通道可分别设置量程，支持 ±10 V、0–10 V、0–20 mA 和 4–20 mA 输入
specs:
  - label: Channels
    value: 8 differential
  - label: Resolution
    value: 12-bit
  - label: Input range
    value: ±10 V, 0–10 V, 0–20 mA, 4–20 mA
  - label: Sampling rate on ADAM-5000/TCP
    value: 100 samples/s max. (total)
  - label: Isolation voltage
    value: 3,000 V DC
  - label: Power consumption
    value: 2.2 W max.
communication:
  protocols:
    - modbus-tcp
  viaChassis: ADAM-5000/TCP or ADAM-5000L/TCP
  defaults:
    tcp:
      unitId: 1
    reference: ADAM-5000/TCP Series User Manual, Edition 1, Figure 6.1 (PDF page 69) and section 6.2.3 (PDF page 61) state that the unit identifier is always 1, a fixed value; section 5.3.2 (PDF page 42) gives the default IP address 10.0.0.1. No TCP port is stated.

modelNumber: ADAM-6024
aliases:
- ADAM6024
category: universal-io-module
description: Modbus TCP universal I/O module with 6 differential analog inputs, 2 analog outputs, 2 DI and 2 DO.
translations:
  zh-CN:
    description: 这款以太网通用 I/O 模块通过 Modbus TCP 通信，提供 6 路差分模拟量输入、2 路模拟量输出、2 路数字量输入和 2 路数字量输出，模拟输入支持 ±10 V 和 0~20 mA 量程。
specs:
- label: Analog inputs
  value: 6 differential, ±10 VDC, 0–20 mA, 4–20 mA, 16 bit
- label: Analog outputs
  value: 2, 0–10 VDC, 0–20 mA, 4–20 mA, 12 bit
- label: Digital inputs
  value: 2, dry or wet contact
- label: Digital outputs
  value: 2, open collector to 30 V, 100 mA
- label: Ethernet
  value: 10/100BASE-T(X), RJ-45
- label: Power input
  value: 10–30 VDC, 4 W at 24 VDC
communication:
  protocols:
  - modbus-tcp

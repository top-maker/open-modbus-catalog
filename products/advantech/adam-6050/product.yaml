modelNumber: ADAM-6050
category: digital-io-module
description: '18-channel isolated digital I/O module: 12 inputs, 6 sink outputs, 3 kHz counters, Modbus TCP.'
translations:
  zh-CN:
    description: 18 通道隔离数字量 I/O 模块，12 路数字输入、6 路集电极开路输出，输入可作 3 kHz 计数器，隔离电压 2000 V，10/100 Mbps 以太网口，支持 Modbus TCP 协议。
specs:
- label: Digital inputs
  value: 12 channels, dry or wet contact, 3 kHz counter and frequency input
- label: Digital outputs
  value: 6 channels, sink type, open collector to 30 V, 100 mA, 5 kHz pulse output
- label: Isolation
  value: 2000 VDC
- label: Communication
  value: 10/100 Mbps Ethernet; Modbus/TCP, MQTT, SNMP, RESTful
- label: Power
  value: 10–30 VDC unregulated, 2 W maximum at 24 VDC
- label: Dimensions
  value: 112 × 60 × 27 mm (H × W × D) with terminal blocks
communication:
  protocols:
  - modbus-tcp

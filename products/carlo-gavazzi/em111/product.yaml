# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: EM111
aliases:
- EM111-DIN
category: energy-meter
description: Single-phase DIN-rail energy meter, Class 1, with RS-485 Modbus RTU, pulse output and dual tariffs.
translations:
  zh-CN:
    description: 这款单相导轨式电能表符合 Class 1 精度，通过 RS-485 Modbus RTU 通信，可测量电压、电流、功率、功率因数和频率，记录正反向有功和无功电能，支持双费率和脉冲输出。
specs:
- label: System
  value: 1-phase 2-wire, 230 VLN AC
- label: Current input
  value: Direct 5(45) A (AV8), CT up to 300 A (AV5), 333 mV sensor up to 600 A (MV5)
- label: Accuracy
  value: Class 1 kWh (EN62053-21), Class B (EN50470-3)
- label: Communication
  value: RS-485 Modbus RTU (S1 option), 9.6–115.2 kbaud
- label: Housing
  value: 1-DIN module, IP51 front
communication:
  protocols:
  - modbus-rtu
  defaults:
    serial:
      unitId: 1
      baudRate: 9600
      parity: none
    reference: 'EM111 datasheet, setup menu table: Modbus address 01, baud 9.6 kbaud, parity none (S1 option)'
documents:
- type: datasheet
  title: EM111 datasheet
  url: 'https://www.gavazziautomation.com/fileadmin/images/PIM/DATASHEET/ENG/EM111_DS_ENG.pdf'
  reference: Page 1 features and how to order; serial port specifications and setup menu table
- type: protocol
  title: EM100 Series and ET100 Series Modbus communication protocol, version 4.0, 2025-06-20
  url: 'https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM100_ET100_Series_CPP.pdf'
  reference: §2.1 request size, page 4; §3.1 data format, page 9; Tables 4.1 and 4.2, pages 11–12; Tables 4.6–4.8, page 15
images:
- path: images/01.svg
  alt: Front-view line illustration of the EM111 single-module DIN-rail meter with its LCD and end terminals
  translations:
    zh-CN:
      alt: EM111 单模块导轨式电能表的正视线稿，显示液晶窗口和两端的接线端子
  view: front-orthographic
  source:
    url: 'https://www.gavazziautomation.com/fileadmin/images/PIM/DATASHEET/ENG/EM111_DS_ENG.pdf'
    reference: Front panel description and dimensions (mm), page 13
  rights: Independently drawn from documented geometry. Pending maintainer release review.

# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: SDM120-M
aliases:
- SDM120M
category: energy-meter
description: Single-phase DIN-rail bidirectional energy meter, 5(45) A, with RS-485 Modbus RTU and pulse outputs.
translations:
  zh-CN:
    description: 这款单相导轨式电能表额定电流 5(45) A，通过 RS-485 Modbus RTU 通信，测量电压、电流、功率、功率因数和频率，可双向计量正反向有功和无功电能，带两路脉冲输出。
specs:
- label: Voltage
  value: 230 V AC (85–276 V AC)
- label: Current
  value: Ib 5 A, Imax 45 A
- label: Active energy accuracy
  value: Class B (EN50470-3:2022), class 1 (IEC62053-21)
- label: Pulse outputs
  value: 2, passive; output 2 fixed at 1000 imp/kWh
- label: Communication
  value: RS-485 Modbus RTU, 2400–38400 bps
communication:
  protocols:
  - modbus-rtu
  defaults:
    serial:
      unitId: 1
      baudRate: 9600
      stopBits: 1
    reference: 'Eastron SDM120-M User Manual v1.0 (2025): RS485 output for Modbus RTU, page 4, baud 9600, address 1; set-up menu items 7–10, stop bits 1'
documents:
- type: manual
  title: Eastron SDM120-M User Manual v1.0, 2025
  url: 'https://www.eastrongroup.com/eastrongroup/2025/03/22/eastronsdm120-musermanualv1.0.pdf'
  reference: Part 1 specification, pages 3–4; set-up menu, pages 7–8; Modbus register map, pages 11–13
images:
- path: images/01.svg
  alt: Front-view line illustration of the SDM120-M single-module DIN-rail meter with its raised display front
  translations:
    zh-CN:
      alt: SDM120-M 单模块导轨式电能表的正视线稿，显示凸起的显示面板和两端的接线螺钉
  view: front-orthographic
  source:
    url: 'https://www.eastrongroup.com/eastrongroup/2025/03/22/eastronsdm120-musermanualv1.0.pdf'
    reference: Dimensions, page 10; mechanics 18 x 118 x 64 mm, page 5
  rights: Independently drawn from documented geometry. Pending maintainer release review.

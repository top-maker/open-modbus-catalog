# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: SDM120-M
aliases:
- SDM120-Modbus
category: energy-meter
description: Single-phase 45 A direct-connected DIN-rail energy meter with pulse outputs and RS-485 Modbus RTU.
translations:
  zh-CN:
    description: 单相两线导轨式电能表，直接接入 45 A，有功电能精度 1 级，测量电压、电流、功率、功率因数、频率和需量，双向计量有功电能，带两路脉冲输出和 RS-485 Modbus RTU 通信。
specs:
- label: Nominal voltage
  value: 120 V or 230 V AC
- label: Current
  value: 0.25–5(45) A, direct connection
- label: Active energy accuracy
  value: Class 1 / Class B (IEC 62053-21 / EN 50470-1/3)
- label: Communication
  value: RS-485 Modbus RTU, 1200–19200 bps
- label: Operating temperature
  value: −25 °C to +55 °C
- label: Dimensions
  value: 18 × 118 × 64 mm (W × H × D), 1 module, DIN rail
communication:
  protocols:
  - modbus-rtu
  defaults:
    serial:
      unitId: 1
      baudRate: 9600
      dataBits: 8
      parity: none
      stopBits: 1
    reference: 'SDM120-M User Manual V1.0: set-up menu table, PDF pages 7–8 (Modbus address 001, baud rate 9600 bps, parity none, stop bits 1); the Modbus RTU description on PDF page 5 lists address 1 to 247. The parity and stop bit register on PDF page 12 marks one stop bit with even parity as the default, which contradicts the menu table; the menu table is followed. Datasheet page 1, Modbus table: data bit 8, fixed'

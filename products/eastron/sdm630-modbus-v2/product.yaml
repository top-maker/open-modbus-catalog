# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: SDM630-Modbus V2
category: energy-meter
description: Three-phase 100 A DIN-rail energy meter, class 1, MID, 2 pulse outputs, RS-485 Modbus RTU.
translations:
  zh-CN:
    description: 导轨式三相电能表，支持三相四线、三相三线和单相两线，直接接入 100 A，有功电能精度 1 级，带两路脉冲输出和 RS-485 Modbus RTU 通信，波特率 2400 至 38400。
specs:
- label: Measurement modes
  value: 3-phase 4-wire, 3-phase 3-wire or single-phase 2-wire
- label: Nominal voltage
  value: 3 × 230/400 V AC
- label: Current
  value: 0.5–10(100) A, direct connection
- label: Active energy accuracy
  value: Class 1 / Class B (IEC 62053-21 / EN 50470-1/3)
- label: Communication
  value: RS-485 Modbus RTU, 2400–38400 bps, address 1–247
- label: Dimensions
  value: 72 × 100 × 66 mm (W × H × D), 4 modules, DIN rail
communication:
  protocols:
  - modbus-rtu

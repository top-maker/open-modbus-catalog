# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: SDM72D-M
category: energy-meter
description: Three-phase 100 A direct-connected DIN-rail energy meter with RS-485 Modbus RTU and pulse output.
translations:
  zh-CN:
    description: 三相导轨式电能表，直接接入最大 100 A，有功电能精度 1 级，可测量各相电压、电流和功率，双向计量有功电能，带可清零电能计数、可配置脉冲输出和 RS-485 Modbus RTU 通信。
specs:
- label: Nominal voltage
  value: 3 × 230/400 V AC
- label: Current
  value: 0.5–10(100) A, direct connection
- label: Active energy accuracy
  value: Class 1 / Class B (EN 50470-3:2022)
- label: Communication
  value: RS-485 Modbus RTU, 2400–38400 bps
- label: Operating temperature
  value: −40 °C to +70 °C
- label: Dimensions
  value: 72 × 100 × 66 mm (W × H × D), 4 modules, DIN rail
communication:
  protocols:
  - modbus-rtu
  defaults:
    serial:
      unitId: 1
      baudRate: 9600
      dataBits: 8
      parity: none
      stopBits: 1
    reference: 'SDM72D-M User Manual V1.1: setup menu table, printed page 16 (PDF page 19), address 001, baud rate 9.6 kbps, parity NONE, stop bit 1; interface table, printed page 6 (PDF page 9). Datasheet page 1, Modbus table: data bit 8, fixed'

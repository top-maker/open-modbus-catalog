modelNumber: C2000
category: energy-meter
description: Single-phase direct-connected smart meter, class 1.0 or 0.5, 110–240 V, RS485, optional Modbus.
translations:
  zh-CN:
    description: 单相直接接入智能电表，精度 1.0 级或 0.5 级，额定电压 110 V 至 240 V，额定电流 5(60) A 至 10(100) A，具备 RS485，协议可选 Modbus。
specs:
- label: Measurement modes
  value: Direct connected, 1-phase 2-wire or 1-phase 3-wire
- label: Accuracy class
  value: Class 1.0 or Class 0.5
- label: Rated voltage
  value: 110 V, 220 V, 230 V or 240 V
- label: Rated current
  value: 5 (60) A, 5 (100) A or 10 (100) A
- label: Communication
  value: DLMS/COSEM, Modbus and IEC 62056-21 protocols over optical, RS232, RS485, RF and BLE; Modbus is a protocol option
- label: Dimensions
  value: 198 × 139 × 83.5 mm (H × W × D)
communication:
  protocols:
  - modbus-rtu

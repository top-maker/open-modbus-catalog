modelNumber: D2000
category: energy-meter
description: Two-phase direct-connected smart meter, class 1.0 or 0.5, 120/208 or 120/240 V, optional Modbus.
translations:
  zh-CN:
    description: 两相三线直接接入智能电表，精度 1.0 级或 0.5 级，额定电压 120/208 V 或 120/240 V，额定电流 5(60) A 至 10(100) A，协议可选 Modbus。
specs:
- label: Measurement modes
  value: Direct connected, 2-phase 3-wire
- label: Accuracy class
  value: Class 1.0 or Class 0.5
- label: Rated voltage
  value: 120/208 V or 120/240 V
- label: Rated current
  value: 5 (60) A, 5 (100) A or 10 (100) A
- label: Communication
  value: DLMS/COSEM, Modbus and IEC 62056-21 protocols over optical, RS232, RS485, RF and BLE; Modbus is a protocol option
- label: Dimensions
  value: 198 × 139 × 83.5 mm (H × W × D)
communication:
  protocols:
  - modbus-rtu

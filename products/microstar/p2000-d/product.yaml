modelNumber: P2000-D
category: energy-meter
description: Three-phase direct-connected smart meter, class 1.0 or 0.5, 90/155–240/415 V, RS485, Modbus option.
translations:
  zh-CN:
    description: 三相直接接入智能电表，精度 1.0 级或 0.5 级，额定电压 90/155 V 至 240/415 V，额定电流 5(80) A 至 5(120) A，具备 RS485，协议可选 Modbus。
specs:
- label: Measurement modes
  value: Direct connected, 3-phase 4-wire 3-element or 3-phase 3-wire 2-element
- label: Accuracy class
  value: Class 1.0 or Class 0.5
- label: Rated voltage
  value: 90/155 V to 240/415 V
- label: Rated current
  value: 5 (80) A, 5 (100) A or 5 (120) A
- label: Communication
  value: DLMS/COSEM, Modbus and IEC 62056-21 protocols over optical, RS232, RS485, RF and BLE; Modbus is a protocol option
- label: Dimensions
  value: 280 × 175 × 109.8 mm (H × W × D)
communication:
  protocols:
  - modbus-rtu

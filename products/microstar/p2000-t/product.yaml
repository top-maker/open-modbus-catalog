modelNumber: P2000-T
category: energy-meter
description: Transformer-operated three-phase smart meter, class 0.2S/0.5S/1.0, 57.7/100–240/415 V, Modbus.
translations:
  zh-CN:
    description: 互感器接入三相智能电表，精度 0.2S、0.5S 或 1.0 级，额定电压 57.7/100 V 至 240/415 V，额定电流 1(5) A 至 5(20) A，协议可选 Modbus。
specs:
- label: Measurement modes
  value: Transformer operated, 3-phase 4-wire 3-element or 3-phase 3-wire 2-element
- label: Accuracy class
  value: Class 0.2S, Class 0.5S or Class 1.0
- label: Rated voltage
  value: 57.7/100 V to 240/415 V
- label: Rated current
  value: 1 (10) A, 5 (10) A, 1 (5) A or 5 (20) A
- label: Communication
  value: DLMS/COSEM, Modbus and IEC 62056-21 protocols over optical, RS232, RS485, RF and BLE; Modbus is a protocol option
- label: Dimensions
  value: 255 × 200 × 84.5 mm (H × W × D)
communication:
  protocols:
  - modbus-rtu

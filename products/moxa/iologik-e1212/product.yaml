# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: ioLogik E1212
aliases:
- ioLogik-E1212
- E1212
category: digital-io-module
description: Modbus TCP remote I/O with 8 digital inputs, 8 jumper-set DIO channels and a 2-port Ethernet switch.
translations:
  zh-CN:
    description: 这款以太网远程 I/O 通过 Modbus TCP 通信，提供 8 路数字量输入和 8 路可用跳线设为输入或输出的 DIO 通道，内置双端口以太网交换机，输入可用作事件计数器，隔离电压 3 kVDC。
specs:
- label: Digital inputs
  value: 8, dry or wet contact, DI or event counter mode
- label: Configurable DIO channels
  value: 8, set by jumper
- label: Digital outputs
  value: Sink, 200 mA per channel, DO or pulse output mode
- label: Counter frequency
  value: 250 Hz
- label: Isolation
  value: 3 kVDC or 2 kVrms
communication:
  protocols:
  - modbus-tcp
  defaults:
    tcp:
      unitId: 1
    reference: 'ioLogik E1200 Series User Manual v16.2, Appendix A, page 87: the Modbus/TCP ID is 1 by default'
documents:
- type: datasheet
  title: ioLogik E1200 Series datasheet v2.5
  url: 'https://www.moxa.com/getmedia/7869edb4-38fb-4682-b809-909d1eb31e84/moxa-iologik-e1200-series-datasheet-v2.5.pdf'
  reference: Specifications, pages 2–3, ioLogik E1212 entries
- type: manual
  title: ioLogik E1200 Series User Manual v16.2, August 2025
  url: 'https://www.moxa.com/getmedia/451bb28e-7e07-4bd7-b8e8-260e093ad73b/moxa-iologik-e1200-series-manual-v16.2.pdf'
  reference: Appendix A, Modbus/TCP Default Address Mappings, page 87; ioLogik E1212 Modbus Address and Register Map, pages 90–91

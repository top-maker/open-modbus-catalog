# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: iEM3255
category: energy-meter
description: 3-phase CT-connected energy meter, MID/MIR, multi-tariff, pulse and digital I/O, RS-485 Modbus RTU.
translations:
  zh-CN:
    description: 三相互感器接入电能表，通过 MID/MIR 认证，额定电流 1 A 或 5 A，支持多费率，带脉冲输出和数字量输入输出，RS-485 接口支持 Modbus RTU，波特率 9600 至 38400。
specs:
- label: Wiring
  value: 3-phase 4-wire, 3-phase 3-wire (delta) or 1-phase 4-wire
- label: Voltage inputs
  value: 100/173…277/480 V ±20% (wye), 173…480 V L-L (delta), 50/60 Hz
- label: Current inputs
  value: 1 A or 5 A nominal CT, measured 20 mA to 6 A
- label: Active energy accuracy
  value: Class 1 / B (1 A CT), Class 0.5S / C (5 A CT); reactive energy Class 2
- label: Communication
  value: RS-485 Modbus RTU, 9600, 19200 or 38400 baud, address 1–247
- label: Dimensions
  value: 90 × 101.5 mm (W × H) front, version with communications
communication:
  protocols:
  - modbus-rtu
  defaults:
    serial:
      stopBits: 1
    reference: 'iEM3100/iEM3200/iEM3300 series user guide DOCA0005EN-16, Modbus communications settings, PDF pages 53-55: the number of stop bits is 1 and fixed; address, baud rate and parity are set on the display and the guide states no factory values for them'

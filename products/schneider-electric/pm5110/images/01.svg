<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Schneider Electric PM5110 front-view illustration</title>
  <desc id="desc">Front orthographic view of the 96 x 96 mm panel-mount power meter with its display window, four round navigation buttons and two indicator LEDs. Schematic, not to scale.</desc>
  <rect width="512" height="512" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="83.2" y="60" width="345.6" height="345.6" rx="5"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="104.8" y="81.6" width="302.4" height="302.4" rx="3"/>
    <rect x="151.6" y="106.8" width="187.2" height="180" rx="1" stroke-width="1.7"/>
    <circle cx="180.4" cy="330" r="14.4"/>
    <circle cx="227.2" cy="330" r="14.4"/>
    <circle cx="274" cy="330" r="14.4"/>
    <circle cx="320.8" cy="330" r="14.4"/>
    <rect x="371.2" y="317.2" width="10.8" height="4"/>
    <rect x="371.2" y="338.8" width="10.8" height="4"/>
  </g>
  <g fill="#000" font-family="sans-serif" text-anchor="middle">
    <text x="256" y="369.6" font-size="10" font-weight="600">PM5110</text>
    <text x="256" y="476" font-size="11" letter-spacing="1">FRONT VIEW</text>
    <text x="256" y="492" font-size="9" letter-spacing="0.8">NOT TO SCALE</text>
  </g>
</svg>

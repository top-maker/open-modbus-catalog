# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: PM5110
aliases:
- METSEPM5110
category: power-meter
description: Panel-mount three-phase power and energy meter, class 0.5S, with RS-485 Modbus RTU and harmonics.
translations:
  zh-CN:
    description: 这款面板安装式三相电力仪表测量电压、电流、功率、需量、电能、频率和功率因数，精度 0.5S 级，可分析 15 次以内奇次谐波，带 1 路数字量输出和 RS-485 Modbus RTU 接口。
specs:
- label: Accuracy
  value: Class 0.5S, IEC 61557-12:2021
- label: Metering
  value: 3-phase voltage, current, power, demand, energy, frequency, power factor
- label: Power quality
  value: THD, thd, TDD; individual odd harmonics up to 15th
- label: Inputs and outputs
  value: 1 digital output
- label: Communication
  value: 1 RS-485 serial port with Modbus protocol
communication:
  protocols:
  - modbus-rtu
  defaults:
    serial:
      unitId: 1
      baudRate: 19200
      parity: even
    reference: 'PowerLogic PM5100 series user manual EAV15105-EN11 (10/2023), RS-485 port setup, page 36: Modbus RTU, address 1, 19200 baud, even parity'
documents:
- type: manual
  title: PowerLogic PM5100 series user manual EAV15105-EN11, 10/2023
  url: 'https://productinfo.se.com/pm5100/pm5100-user-manual/PM5100%20User%20Manual/English/EAV15105-EN11.pdf'
  reference: Product overview table, page 13; RS-485 port setup, page 36
- type: protocol
  title: PM51xx_PM53xx_PMC Register List v2011_v2021 R01 (Excel), published 2025-06-17
  url: 'https://se.my.site.com/ckmContent/sfc/servlet.shepherd/document/download/069Kj00000TH2LXIA1'
  reference: Register List sheet, PM5110_11 column; listed on se.com FAQ FA234017
images:
- path: images/01.svg
  alt: Front-view line illustration of the PM5110 panel meter with its display and four navigation buttons
  translations:
    zh-CN:
      alt: PM5110 面板式电力仪表的正视线稿，显示屏幕和四个导航按键
  view: front-orthographic
  source:
    url: 'https://productinfo.se.com/pm5100/pm5100-user-manual/PM5100%20User%20Manual/English/EAV15105-EN11.pdf'
    reference: Display overview, page 22; dimensions 96 x 96 mm, page 85

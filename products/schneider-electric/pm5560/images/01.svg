<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">PM5560 front-view illustration</title>
  <desc id="desc">Front orthographic outline of the PM5560 panel meter, 96 mm by 96 mm, with its display area and four buttons, drawn from the instruction sheet dimensions; the button positions are approximate.</desc>
  <rect width="512" height="512" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="71" y="30" width="370" height="370" rx="15.4"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="126.9" y="64.7" width="258.2" height="240.9" rx="7.7"/>
    <circle cx="148.1" cy="349.9" r="15.4"/>
    <circle cx="217.5" cy="349.9" r="15.4"/>
    <circle cx="294.5" cy="349.9" r="15.4"/>
    <circle cx="363.9" cy="349.9" r="15.4"/>
  </g>
  <g fill="#000" font-family="sans-serif" text-anchor="middle">
    <text x="256" y="436" font-size="13" font-weight="600">PM5560</text>
    <text x="256" y="456" font-size="11">FRONT VIEW</text>
    <text x="256" y="474" font-size="11">NOT TO SCALE</text>
  </g>
</svg>

# yaml-language-server: $schema=../../../schema/product.schema.json

modelNumber: PM5560
category: power-meter
description: Panel-mount 96 × 96 mm power meter, class 0.2S, harmonics to the 63rd, Modbus RTU and Modbus TCP.
translations:
  zh-CN:
    description: 96 × 96 mm 面板安装电力仪表，带显示屏，精度 0.2S 级，测量到 63 次谐波，具备 RS-485 和以太网口，支持 Modbus RTU 与 Modbus TCP 通信。
specs:
- label: Form factor
  value: Front panel mount, integrated display, 96 × 96 mm, fits a 1/4 DIN hole
- label: Accuracy
  value: IEC 62053-22 Class 0.5S / 0.2S; IEC 61557-12 PMD/S/K70/0.2
- label: Voltage inputs
  value: 20–400 V L-N / 20–690 V L-L (wye), 50 or 60 Hz
- label: Control power
  value: 100–480 V AC ±10% or 125–250 V DC ±20%
- label: Harmonics
  value: Up to the 63rd harmonic on all voltage and current inputs
- label: Communication
  value: RS-485 Modbus RTU; Ethernet Modbus TCP/IP, EtherNet/IP and BACnet/IP
communication:
  protocols:
  - modbus-rtu
  - modbus-tcp
  firmware: 4.1.8 (Modbus register list Rev 1.4)
